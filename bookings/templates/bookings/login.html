<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng nhập</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center">
              <h4 class="mb-0 fw-bold">Đăng Nhập Hệ Thống</h4>
            </div>
            <div class="card-body p-4">
              <form method="POST">
                {% csrf_token %} {% if request.GET.next %}
                <input
                  type="hidden"
                  name="next"
                  value="{{ request.GET.next }}"
                />
                {% endif %} {{ form.as_p }}
                <button
                  type="submit"
                  class="btn btn-primary w-100 fw-bold mt-2"
                >
                  Đăng Nhập
                </button>
              </form>
              <p class="text-center mt-3 mb-0">
                Chưa có tài khoản?
                <a href="{% url 'register' %}">Đăng ký tại đây</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
