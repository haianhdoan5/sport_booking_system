{% extends "bookings/base.html" %} {% block title %}Đăng ký tài khoản{% endblock %} {% block content %}
<div class="container page-shell mt-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      {% if messages %} {% for message in messages %}
      <div class="alert alert-danger alert-dismissible fade show fw-bold shadow-sm">⚠️ {{ message }}</div>
      {% endfor %} {% endif %}
      <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white text-center">
          <h4 class="mb-0 fw-bold">Tạo Tài Khoản Mới</h4>
        </div>
        <div class="card-body p-4">
          <form method="POST">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 fw-bold mt-2">Đăng Ký</button>
          </form>
          <p class="text-center mt-3 mb-0">Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập ngay</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
